<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 840" role="img" aria-labelledby="title desc">
<title id="title">Wollmar fyller 5 - Zorroinspirerad kalasinbjudan</title>
<desc id="desc">En egenritad tecknad maskerad svärdsman med svart hatt och mask, röd mantel och blå bakgrund med dekorativa svärdsspår.</desc>
