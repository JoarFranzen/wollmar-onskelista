<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#233657">
<meta name="description" content="Vi firar Wollmar 5 år! Vänd på inbjudningskortet och kika på önskelistan.">
<title>Wollmar fyller 5 år! 🎈</title>
<link rel="preload" as="image" href="invitation-back.webp">
<style>
*{box-sizing:border-box}html{min-height:100%;background:#192942}body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:16px;font-family:system-ui,sans-serif;background:radial-gradient(ellipse at top,#354f75,#192942);color:#fff}.stage{width:min(100%,540px,calc((100vh - 110px)*.641));width:min(100%,540px,calc((100svh - 110px)*.641));perspective:1800px;-webkit-perspective:1800px}.card{position:relative;width:100%;aspect-ratio:1033/1220;transform:rotateY(0deg);transform-style:preserve-3d;-webkit-transform-style:preserve-3d;transition:transform .85s cubic-bezier(.2,.72,.18,1)}.card.is-flipped{aspect-ratio:1035/1615;transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;box-shadow:0 16px 40px #0006;overflow:hidden;background:#233657}.face img{display:block;width:100%;height:100%;object-fit:contain}.back{transform:rotateY(180deg)}button{font:inherit}.front{padding:0;border:0;width:100%;cursor:pointer}.wishlist-link{position:absolute;left:7%;top:42%;width:86%;height:23%;border-radius:12px;text-decoration:none}.wishlist-link:hover{background:#ffffff0d}.wishlist-link:focus-visible{outline:3px solid #fff;outline-offset:2px;background:#ffffff18}.front:focus-visible,.turn-back:focus-visible{outline:3px solid #ffdf75;outline-offset:4px}.hint{margin:14px 0 0;text-align:center;font-size:12px;line-height:1.5;color:#e3eaf4}.turn-back{display:block;margin:12px auto 0;padding:8px 16px;border:1px solid #a8b8d0;border-radius:24px;background:transparent;color:white;cursor:pointer}.turn-back[hidden]{display:none}@media(prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<main class="stage" aria-label="Inbjudan till Wollmars femårskalas">
<div class="card" id="birthday-card">
<button class="face front" id="front" type="button" aria-label="Vänd på inbjudningskortet för att se länken till önskelistan">
<img src="invitation-front.webp" width="1033" height="1220" alt="Vi firar Wollmar 5 år! 29 november 2026 klockan 14.00 på Ekehjelmstorget. Följ ballongerna till lokalen! Klicka för att vända kortet.">
</button>
<section class="face back" id="back" aria-label="Kortets baksida" aria-hidden="true" inert>
<img src="invitation-back.webp" width="1035" height="1615" alt="Blått kort med Spider-Man, Pokémon och andra äventyrsfigurer. Klicka här för att komma till önskelistan.">
<a class="wishlist-link" id="wishlist-link" href="onskelista.html" aria-label="Öppna Wollmars önskelista"></a>
</section>
</div>
<p class="hint" id="hint" aria-live="polite">Klicka på kortet för att vända det ↻</p>
<button class="turn-back" id="turn-back" type="button" hidden>↶ Vänd tillbaka</button>
<noscript><p><a href="onskelista.html" style="color:white">Öppna Wollmars önskelista</a></p></noscript>
</main>
<script>
const card=document.getElementById('birthday-card');
const front=document.getElementById('front');
const back=document.getElementById('back');
const link=document.getElementById('wishlist-link');
const turnBack=document.getElementById('turn-back');
const hint=document.getElementById('hint');
function showBack(flipped){
  card.classList.toggle('is-flipped',flipped);
  front.inert=flipped;back.inert=!flipped;
  turnBack.hidden=!flipped;
  hint.textContent=flipped?'Klicka på texten för att öppna önskelistan':'Klicka på kortet för att vända det ↻';
  if(flipped){
    back.removeAttribute('aria-hidden');link.focus({preventScroll:true});front.setAttribute('aria-hidden','true');
  }else{
    front.removeAttribute('aria-hidden');front.focus({preventScroll:true});back.setAttribute('aria-hidden','true');
  }
}
front.addEventListener('click',()=>showBack(true));
turnBack.addEventListener('click',()=>showBack(false));
back.addEventListener('click',event=>{if(!event.target.closest('a'))showBack(false)});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&card.classList.contains('is-flipped'))showBack(false)});
</script>
</body>
</html>
