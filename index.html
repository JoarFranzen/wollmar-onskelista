<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f3e5"><title>Wollmars kalasinbjudan</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:18px;background:#f1eee7;font-family:"Helvetica Neue",Arial,sans-serif;color:#3c5942}.wrap{width:min(100%,440px)}.hint{text-align:center;font-size:11px;color:#7c8e78;letter-spacing:.12em;margin:0 0 12px}.card{position:relative;width:100%;aspect-ratio:600/840;max-height:calc(100svh - 80px);transform-style:preserve-3d;transition:transform .85s cubic-bezier(.2,.72,.18,1);cursor:pointer;filter:drop-shadow(0 16px 28px #514b3025);outline:none}.card.flipped{transform:rotateY(180deg)}.face{position:absolute;inset:0;border-radius:24px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:7px solid #fffdf6}.front{background:#f7f3e5}.front .dino{width:100%;height:100%;object-fit:cover;display:block}.front .wollmar{position:absolute;width:43%;aspect-ratio:1;object-fit:cover;border:7px solid #fffdf6;border-radius:50%;top:15%;left:28.5%;box-shadow:0 5px 18px #2b563b30}.back{transform:rotateY(180deg);background:#8acb8e;display:flex;flex-direction:column;align-items:center;text-align:center;padding:9%;border:7px solid #fffdf6;color:#fffdf6}.back:before{content:"";position:absolute;inset:12px;border:2px solid #f8f5e6;border-radius:16px;pointer-events:none}.kicker{font-size:10px;font-weight:800;letter-spacing:.18em;position:relative}.back h1{font:700 clamp(30px,7vw,43px)/1.05 Georgia,serif;margin:12px 0 6px;position:relative}.subtitle{font:italic 15px Georgia,serif;margin:0 0 16px;position:relative}.photo{width:clamp(105px,32%,145px);aspect-ratio:1;object-fit:cover;border:5px solid #f8f5e6;border-radius:50%;margin:2px auto 17px;position:relative}.details{font:17px/1.65 Georgia,serif;position:relative;margin:0 0 18px}.wish-link{position:relative;display:flex;align-items:center;justify-content:center;gap:12px;text-decoration:none;color:#fffdf6;background:#397a47;border:2px solid #e7f3dc;border-radius:999px;padding:15px 18px;width:100%;font-weight:800;box-shadow:0 4px 0 #2d633c;margin-top:auto;font-size:16px}.wish-link span:first-child{font-size:24px}.wish-link .arrow{font-size:23px;margin-left:auto}.backhint{font-size:10px;margin:14px 0 0;position:relative}@media(max-width:400px){body{padding:12px}.card{max-height:calc(100svh - 70px)}.face{border-width:5px;border-radius:18px}.back{padding:8%}.back .photo{width:27%;margin-bottom:12px}.details{font-size:15px;margin-bottom:12px}.wish-link{padding:12px;font-size:14px}}@media(prefers-reduced-motion:reduce){.card{transition:none}}
/* Step 1: retain the original CSS-drawn dinosaur invitation and style the reverse as one solid green card. */
.back{background:#80bf88!important;color:#fffdf2!important;border:8px solid #fffdf4!important;padding:7%!important}
.back:before{inset:12px!important;border:2px solid #f8f3df!important;border-radius:16px!important;border-style:solid!important}
.back h2{color:#fffdf2!important}
.back-kicker,.back-sub,.interests,.back-note{color:#f8f3df!important}
.fact-grid{position:relative;z-index:1}
.fact{background:#f8f3df!important;border:1px solid #e7dfc8!important}
.fact small{color:#6b7e61!important}
.fact strong{color:#315c40!important}
.wishlist-link{background:#315c40!important;color:#fffdf2!important;border:2px solid #f8f3df!important;box-shadow:0 4px 0 #244832!important}
.front .wollmar-front{width:clamp(88px,24%,130px);height:clamp(88px,24%,130px);object-fit:cover;border:6px solid #fffdf4;border-radius:50%;box-shadow:0 5px 18px #315c4033;margin:4px auto 0;position:relative;z-index:3}
@media(max-height:720px){.front .wollmar-front{width:75px;height:75px}}
</style></head><body><main class="wrap"><p class="hint">✦ WOLLMARS KALASINBJUDAN ✦</p><div class="card" id="card" role="button" tabindex="0" aria-label="Vänd på inbjudningskortet" aria-pressed="false"><div class="face front"><img class="dino" src="invitation-front.svg" alt="Grön dinosaurie på kalasinbjudan"><img class="wollmar" src="Wollmar_bild.jpeg" alt="Wollmar" onerror="this.style.display='none'"></div><section class="face back" aria-label="Baksida med kalasinformation och önskelista"><span class="kicker">✦ KALAS HOS WOLLMAR ✦</span><h1>Wollmar fyller 5!</h1><p class="subtitle">Vi firar med kalas den 29:e november!</p><img class="photo" src="Wollmar_bild.jpeg" alt="Wollmar" onerror="this.style.display='none'"><p class="details">30 november<br>Hemma hos oss på Ekeholmstorget 4<br>Följ ballongerna!</p><a class="wish-link" href="onskelista.html"><span>♧</span><span>Till önskelistan</span><span class="arrow">→</span></a><p class="backhint">Klicka på kortet för att vända tillbaka</p></section></div><p class="hint" style="margin-top:13px">KLICKA PÅ KORTET FÖR ATT VÄNDA ↻</p></main><script>const card=document.getElementById('card');function flip(){const f=card.classList.toggle('flipped');card.setAttribute('aria-pressed',String(f))}card.addEventListener('click',e=>{if(e.target.closest('a'))return;flip()});card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip()}});</script></body></html>
