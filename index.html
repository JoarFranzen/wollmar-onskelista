<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff8ef"><meta name="description" content="Wollmars önskelista. Små och stora saker han drömmer om."><title>Wollmars önskelista</title><link rel="stylesheet" href="styles.css"></head>
<body><header class="topbar"><a class="brand" href="#">Wollmars önskelista</a><button id="admin-open" class="admin-link">Vuxenläge</button></header><main>
<section class="hero"><h1>Wollmars önskelista</h1><p class="intro">Välj det du vill köpa och paxa det här.</p></section><section class="list-section"><div class="section-head"><div><h2>Önskningar</h2></div><span id="wish-count" class="count-pill">Laddar…</span></div><div id="status" class="status">Öppnar önskelistan…</div><div id="wish-grid" class="wish-grid"></div></section></main>
<dialog id="admin-dialog" class="admin-dialog"><form method="dialog" class="dialog-top"><div><h2>Vuxenläge</h2></div><button class="icon-button" value="close" aria-label="Stäng">×</button></form><div id="admin-auth"><p>Logga in för att redigera önskelistan.</p><label for="admin-password">Lösenord</label><input id="admin-password" type="password" autocomplete="current-password" placeholder="Lösenord"><button id="login-button" class="primary-button" type="button">Logga in</button><p id="admin-help" class="fine-print"></p></div>
<div id="admin-panel" hidden><div class="admin-toolbar"><p id="admin-welcome"></p><button id="logout-button" class="quiet-button" type="button">Logga ut</button></div><form id="wish-form" class="wish-form"><input type="hidden" id="wish-id"><label for="wish-title">Vad önskar du dig?</label><input id="wish-title" maxlength="100" required placeholder="Till exempel Pokémonbollar"><label for="wish-description">Beskrivning</label><textarea id="wish-description" rows="2" maxlength="500" placeholder="Valfri info"></textarea><label for="wish-items">Valbara saker (en per rad)</label><textarea id="wish-items" rows="4" maxlength="1000" placeholder="Pidgeotto&#10;Bulbasaur&#10;Charmander&#10;Squirtle&#10;Pikachu"></textarea><label for="wish-link">Länk till presenten</label><input id="wish-link" type="url" placeholder="https://…"><label for="wish-image">Bildlänk (valfritt)</label><input id="wish-image" type="url" placeholder="https://…"><label for="wish-price">Ungefärligt pris (valfritt)</label><input id="wish-price" placeholder="Till exempel 249 kr"><label for="wish-category">Kategori</label><select id="wish-category"></select><div class="category-manager"><label for="new-category">Kategorier</label><div class="category-add"><input id="new-category" maxlength="40" placeholder="Ny kategori"><button id="add-category" class="quiet-button" type="button">Lägg till</button></div><div id="category-list" class="category-list"></div></div><div class="form-actions"><button class="primary-button" type="submit">Spara</button><button id="cancel-edit" class="quiet-button" type="button">Rensa</button></div></form><h3 class="manage-heading">Alla önskningar</h3><div id="manage-list" class="manage-list"></div></div><p id="admin-error" class="error-message" role="alert" hidden></p></dialog><div id="toast" class="toast" role="status" aria-live="polite"></div><script type="module" src="app.js"></script></body></html>
